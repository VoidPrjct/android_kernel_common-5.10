name: upstream-merge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag yang akan di-merge'
        required: true
        default: 'v5.10.275'
      branch:
        description: 'Branch tujuan push (merge bersih)'
        required: true
        default: 'android12-5.10'
      wip_branch:
        description: 'Branch tujuan push (kalau ada konflik)'
        required: true
        default: 'wip/upstream-275'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "VoidPrjct CI"
          git config user.email "voidprjcts@gmail.com"

      - name: Fetch stable tag
        run: |
          git remote add stable https://github.com/gregkh/linux.git
          git fetch --no-tags stable "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
          git log -1 --oneline "${{ inputs.tag }}"

      - name: Merge
        run: |
          if git merge --no-edit "${{ inputs.tag }}"; then
            echo "== merge bersih, ringkasan:"
            git log -1 --stat | tail -5
            echo "MERGE_CLEAN=yes" >> "$GITHUB_ENV"
          else
            echo "== KONFLIK di file berikut:"
            git diff --name-only --diff-filter=U | tee "$GITHUB_WORKSPACE/conflicts.txt"
            git add -A
            git commit -m "WIP: merge ${{ inputs.tag }} (konflik belum selesai, marker dibiarkan)"

      - name: Push bersih
        if: env.MERGE_CLEAN == 'yes'
        run: git push origin "HEAD:refs/heads/${{ inputs.branch }}"

      - name: Push WIP (konflik)
        if: env.MERGE_CLEAN != 'yes'
        run: git push origin "HEAD:refs/heads/${{ inputs.wip_branch }}"

      - name: Upload daftar konflik
        if: env.MERGE_CLEAN != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: conflicts
          path: conflicts.txt
